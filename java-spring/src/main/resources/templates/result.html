<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Result</title>
  <link rel="stylesheet" th:href="@{/style.css}" />
</head>
<body>

<div th:replace="~{fragments/navigation-bar :: navigation-bar(
        ~{fragments/navigation-bar-elements :: back-to-menu},
        'Result',
        ~{fragments/navigation-bar-elements :: game-next})}">
</div>

<div id="correctAnswer" th:data-correct-uid="${correctAnswerUid}"> </div>

<ul id="answersData" style="display:none;">
  <li th:each="a : ${answers}"
      class="answerData"
      th:data-uid="${a.uid}"
      th:data-content="${a.content}"
      th:data-count="${a.count}">
  </li>
</ul>

<div class="page center-screen">
  <div class="box">
    <h2>Result</h2>
    <ul id="resultList"></ul>

<script src="/result.js"></script>

  </div>
</div>

</body>
</html>
