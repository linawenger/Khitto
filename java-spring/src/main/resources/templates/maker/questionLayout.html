<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="questionTemplateFragment">
<body>

<template id="questionTemplate">
    <div class="question-block">
        <label class="question-label">Question</label>
        <input class="input" name="q[]" placeholder="Question text" />

        <div class="answers-list">

            <div class="answer-row">
                <input class="input answer-input" name="a1[]" placeholder="Answer 1" />
                <label class="correct-label">
                    <input type="radio" name="correct" value="1" checked />
                    correct
                </label>
            </div>

            <div class="answer-row">
                <input class="input answer-input" name="a2[]" placeholder="Answer 2" />
                <label class="correct-label">
                    <input type="radio" name="correct" value="2" />
                    correct
                </label>
            </div>

            <div class="answer-row">
                <input class="input answer-input" name="a3[]" placeholder="Answer 3" />
                <label class="correct-label">
                    <input type="radio" name="correct" value="3" />
                    correct
                </label>
            </div>

            <div class="answer-row">
                <input class="input answer-input" name="a4[]" placeholder="Answer 4" />
                <label class="correct-label">
                    <input type="radio" name="correct" value="4" />
                    correct
                </label>
            </div>
        </div>

        <input type="hidden" name="correct[]" class="hidden-correct-answer" value="1" />
    </div>
</template>

</body>
</html>
