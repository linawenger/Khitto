<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Import Game</title>
  <link rel="stylesheet" th:href="@{/style.css}" />
  <script defer src="/import.js"></script>
</head>
<body>

<div th:replace="~{fragments/navigation-bar :: navigation-bar(
        ~{fragments/navigation-bar-elements :: back-to-menu},
        'Import game',
        ~{fragments/navigation-bar-elements :: import-submit})}">
</div>

<div class="page center-screen">
  <div class="box">
    <h2 th:text="'Import a game'">
      Import a game
    </h2>

    <form>
      <div style="margin-bottom:16px; text-align:left;">
        <label for="importTitle">
          Game title
        </label>
        <input id="importTitle"
               class="input"
               placeholder="Game title" />
      </div>

      <div style="margin-bottom:16px; text-align:left;">
        <p style="font-size:0.85rem;">
          JSON format (OpenTriviaDB) must contain per question:
        </p>

        <pre class="import-example">
        {
          "type": "multiple",
          "question": "...",
          "correct_answer": "...",
          "incorrect_answers": ["...", "...", "..."]
        }
        </pre>
      </div>

      <div id="dropZone" class="drop-zone">
        Click to select JSON file
        <input type="file"
               id="fileInput"
               accept=".json"
               hidden />
      </div>
    </form>
  </div>
</div>

</body>
</html>
