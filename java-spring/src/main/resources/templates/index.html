<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ditto Tasks • Dark</title>

  <!-- HTMX + SSE -->
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/htmx-ext-sse@2.2.2"></script>

  <!-- Apple-like system font stack -->
  <style>
    :root {
      --bg: #0b0b0c;
      --surface: #151517;
      --elev-1: rgba(255,255,255,0.06);
      --elev-2: rgba(255,255,255,0.09);
      --text: #f2f2f7;
      --text-dim: #c7c7cc;
      --accent: #0a84ff;   /* iOS/macOS accent blue */
      --accent-2: #64d2ff; /* secondary blue */
      --success: #30d158;
      --danger: #ff453a;
      --warn: #ffd60a;
      --shadow: 0 10px 30px rgba(0,0,0,0.35);
      --radius: 16px;
      --radius-sm: 12px;
      --radius-lg: 22px;
      --blur: saturate(180%) blur(14px);
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f5f5f7; --surface: #ffffff; --text: #1c1c1e; --text-dim:#6e6e73; --elev-1: rgba(0,0,0,0.06); --elev-2: rgba(0,0,0,0.09); }
      .only-dark{display:none!important;}
    }

    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: radial-gradient(1200px 800px at 80% -10%, rgba(100,210,255,0.06), transparent 60%),
                  radial-gradient(900px 600px at -10% 20%, rgba(10,132,255,0.08), transparent 65%),
                  var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    /* Translucent, glassy header */
    .glassbar {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.04));
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 0 0 var(--radius) var(--radius);
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      font-size: 13px;
      color: var(--text-dim);
    }

    .page {
      margin-top: 28px;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 28px;
    }
    @media (max-width: 900px){
      .page{ grid-template-columns: 1fr; }
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      overflow: clip;
    }
    .card-head {
      padding: 16px 18px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .card-body {
      padding: 16px 18px 18px;
    }
    .heading {
      margin: 0;
      font-size: 18px;
      letter-spacing: .2px;
    }
    .subtle {
      color: var(--text-dim);
      font-size: 13px;
    }

    /* Buttons */
    .btn {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.15);
      background: linear-gradient(180deg, rgba(10,132,255,0.18), rgba(10,132,255,0.15));
      color: var(--text);
      padding: 10px 14px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: transform .06s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;
      box-shadow: 0 6px 18px rgba(10,132,255,0.25);
    }
    .btn:hover{ transform: translateY(-1px); border-color: rgba(100,210,255,0.5); }
    .btn:active{ transform: translateY(0); }

    .btn-ghost{
      background: transparent;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: none;
    }
    .btn-danger{
      background: linear-gradient(180deg, rgba(255,69,58,0.22), rgba(255,69,58,0.18));
      border-color: rgba(255,69,58,0.4);
      box-shadow: 0 6px 18px rgba(255,69,58,0.25);
    }

    /* Form elements */
    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }
    .input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      outline: none;
      transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
    }
    .input::placeholder{ color: #9b9ba0; }
    .input:focus {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 4px rgba(10,132,255,0.2);
      background: rgba(255,255,255,0.08);
    }

    /* Task list */
    #task_list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }
    .task {
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      gap: 10px;
      align-items: center;
      padding: 12px;
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.08);
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.03));
      transition: border-color .2s ease, background .2s ease, transform .06s ease;
    }
    .task:hover{ border-color: rgba(255,255,255,0.16); transform: translateY(-1px); }
    .task .title { font-weight: 600; }
    .task.done .title { text-decoration: line-through; color: var(--text-dim); }

    .check {
      appearance: none;
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      padding: 6px 10px;
      border-radius: 10px;
      transition: background .2s ease;
      color: var(--success);
    }
    .check span { display: inline-block; width: 22px; text-align: center; }
    .check:hover { background: rgba(48,209,88,0.1); }

    .edit, .delete {
      appearance: none;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      transition: border-color .2s ease, background .2s ease, transform .06s ease;
    }
    .edit:hover{ border-color: var(--accent-2); background: rgba(10,132,255,0.1); }
    .delete{ color: #ff6961; }
    .delete:hover{ border-color: rgba(255,69,58,0.5); background: rgba(255,69,58,0.12); }

    /* Small helpers */
    .row { display: flex; align-items: center; gap: 8px; }
    .spacer { flex: 1; }
    .muted { color: var(--text-dim); }
    .pill { padding: 6px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.12); }
    .mt-8{ margin-top: 8px; }
    .mt-16{ margin-top: 16px; }

    /* Fade-in */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .appear { animation: fadeIn .25s ease both; }
  </style>
</head>
<body>
  <!-- Sticky translucent header -->
  <header class="glassbar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M16.365 1.43c-.96.055-2.098.66-2.77 1.44-.602.693-1.16 1.8-.956 2.873 1.055.082 2.14-.536 2.82-1.337.647-.76 1.156-1.852.906-2.976zm3.336 12.14c-.033-3.25 2.66-4.814 2.78-4.886-1.52-2.223-3.884-2.521-4.72-2.549-2.01-.204-3.93 1.184-4.953 1.184-1.04 0-2.59-1.158-4.27-1.12-2.19.034-4.212 1.302-5.34 3.3-2.28 3.94-.58 9.77 1.64 12.98 1.08 1.55 2.36 3.3 4.05 3.24 1.64-.066 2.26-1.046 4.24-1.046 1.98 0 2.54 1.046 4.28 1.01 1.78-.03 2.9-1.56 3.97-3.12 1.25-1.78 1.77-3.5 1.8-3.6-.04-.02-3.46-1.33-3.48-5.39z"/>
      </svg>
      <span>Ditto Tasks</span>
      <span class="badge subtle"
            id="sync_state"
            hx-ext="sse"
            sse-connect="/ditto/sync/state"
            sse-swap="sync_state">
        Sync State: True
      </span>
    </div>
    <div class="row">
      <button class="btn btn-ghost" type="button" hx-post="/ditto/sync/toggle" hx-swap="none">Toggle Sync</button>
    </div>
  </header>

  <main class="container">
    <section class="page appear">
      <!-- Task list (SSE-powered) -->
      <div class="card"
           id="list-section"
           hx-ext="sse"
           sse-connect="/tasks/stream"
           sse-swap="task_list">
        <div class="card-head">
          <h2 class="heading">Deine Aufgaben</h2>
          <span class="subtle">Live aktualisiert</span>
        </div>
        <div class="card-body">
          <div th:replace="fragments/taskList :: taskListFrag(${tasks})"></div>
        </div>
      </div>

      <!-- Add form -->
      <div class="card">
        <div class="card-head">
          <h2 class="heading">Neue Aufgabe</h2>
          <span class="subtle">Schnell hinzufügen</span>
        </div>
        <div class="card-body">
          <form class="appear" hx-post="/tasks" hx-swap="none"
                hx-on::after-request="if(event.detail.successful) this.reset()">
            <div class="field">
              <label for="new_title" class="subtle">Titel</label>
              <input id="new_title" class="input" type="text" name="title" placeholder="Task Beschreibung…" required />
            </div>
            <div class="row mt-8">
              <div class="spacer"></div>
              <button class="btn" type="submit">Hinzufügen</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script>
    // small helper: log SSE for debugging
    document.body.addEventListener('htmx:sseBeforeMessage', function (e) {
      console.log("[SSE]", e?.detail);
    });
  </script>
</body>
</html>
