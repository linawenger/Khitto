<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Khitto Menu</title>
  <link rel="stylesheet" th:href="@{/style.css}" />
</head>
<body>

<div th:replace="~{fragments/navigation-bar :: navigation-bar(
        ~{fragments/navigation-bar :: empty},
        'Khitto Menu',
        ~{fragments/navigation-bar :: empty})}">
</div>

<div class="page">
  <div id="gameList"
       th:insert="~{fragments/gameList :: gameList(games=${games})}">
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    console.log("Khitto Menu: init SSE");

    const gameListContainer = document.getElementById("gameList");
    if (!gameListContainer) {
      console.log("Khitto Menu: #gameList not found");
      return;
    }

    const eventSource = new EventSource("/games/stream");

    eventSource.addEventListener("game_list", function (event) {
      console.log("Khitto Menu: received game_list event");
      gameListContainer.innerHTML = event.data;
    });

    eventSource.onerror = function (err) {
      console.error("Khitto Menu: SSE error", err);
    };
  });
</script>

</body>
</html>
