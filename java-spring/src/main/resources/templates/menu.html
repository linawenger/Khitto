<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Khitto Menu</title>
  <link rel="stylesheet" th:href="@{/style.css}" />
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/htmx-ext-sse@2.2.2"></script>
</head>
<body>

<div th:replace="~{fragments/navigation-bar :: navigation-bar(
        ~{fragments/navigation-bar :: empty},
        'Khitto Menu',
        ~{fragments/navigation-bar :: empty})}">
</div>

<div class="page">

  <div id="game-list-section"
       hx-ext="sse"
       sse-connect="/games/stream"
       sse-swap="game_list"
       hx-target="#game_list"
       hx-swap="outerHTML">

    <div th:replace="~{fragments/gameList :: gameListFrag(${games})}"></div>
  </div>
</div>

</body>
</html>
