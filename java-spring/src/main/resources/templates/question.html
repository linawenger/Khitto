<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Question</title>
  <link rel="stylesheet" th:href="@{/style.css}" />
  <script defer th:src="@{/question.js}"></script>
  <script defer th:src="@{/game-logic.js}"></script>

</head>
<body>

<div th:replace="~{fragments/navigation-bar :: navigation-bar(
        ~{fragments/navigation-bar-elements :: question-left},
        'Question',
        ~{fragments/navigation-bar-elements :: game-next})}">
</div>
<style>
  .navigation-right {
    visibility: hidden;
  }
</style>

<div id="gameMeta"
     th:data-game-id="${game.id}"
     th:data-game-status="${game.status}"
     style="display:none;"></div>

<div class="page">
  <h2 th:text="${question.content}">Question text…</h2>

  <div id="answers">
    <div th:each="answer : ${answers}"
         class="answer-box"
         th:attr="data-uid=${answer.uid}">
      <span th:text="${answer.content}">Answer</span>
    </div>
  </div>
</div>

</body>
</html>
