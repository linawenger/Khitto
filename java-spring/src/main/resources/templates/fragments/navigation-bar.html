<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<navigation class="navigation"
            th:fragment="navigation-bar(left, title, right)">
  <div class="navigation-left">
    <div th:if="${left}" th:replace="${left}"></div>
  </div>

  <div class="navigation-center">
    <span th:text="${title}">Title</span>
  </div>

  <div class="navigation-right">
    <div th:if="${right}" th:replace="${right}"></div>
  </div>
</navigation>

<th:block th:fragment="empty"></th:block>

</body>
</html>
