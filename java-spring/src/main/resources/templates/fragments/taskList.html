<ul id="task_list" th:fragment="taskListFrag (tasks)">
  <li class="task" th:each="item : ${tasks}" th:classappend="${item.done} ? ' done' : ''">
    <button class="check"
            type="button"
            th:attr="hx-post=@{~/tasks/{id}/toggle(id=${item.id})}"
            hx-swap="none"
            title="Fertig/Unerledigt umschalten">
      <span th:text="${item.done} ? '✔' : '☐'">☐</span>
    </button>

    <span class="title" th:text="${item.title}">Sample Todo</span>

    <button class="edit"
            type="button"
            th:attr="hx-get=@{~/tasks/{id}/edit-form(id=${item.id})},hx-target=@{#edit-form-{id}(id=${item.id})}"
            hx-swap="innerHTML">
      Bearbeiten
    </button>

    <button class="delete"
            type="button"
            th:attr="hx-delete=@{~/tasks/{id}(id=${item.id})}"
            hx-swap="none">
      Löschen
    </button>

    <div class="mt-16" th:id="@{edit-form-{id}(id=${item.id})}"></div>
  </li>
</ul>
