<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="gameList (games)" class="grid-games">

    <div th:each="game : ${games}" class="game-card"
         style="display:flex; flex-direction:column; gap:6px;">

        <!-- Keine @{ } mehr, sondern einfacher String -->
        <a th:href="'/games/' + ${game.id}"
           class="game-card-link"
           style="flex:1; display:flex; align-items:center; justify-content:center;">
            <span th:text="${game.name}">Game</span>
        </a>

        <div class="game-card-actions"
             style="display:flex; gap:6px; justify-content:space-between;">

            <form th:action="'/maker/' + ${game.id}" method="get" style="flex:1;">
                <button class="button" style="width:100%;">Modify</button>
            </form>

            <form th:action="'/games/' + ${game.id} + '/delete'" method="post" style="flex:1;">
                <button class="button button-delete" style="width:100%;">Delete</button>
            </form>

        </div>
    </div>

    <form th:action="'/games/new'" method="post" class="game-card" style="gap:4px;">
        <button type="submit" class="button" style="width:100%;">
            + New Game
        </button>
    </form>

</div>
</body>
</html>
