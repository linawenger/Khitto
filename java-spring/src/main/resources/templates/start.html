<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Startscreen</title>
  <link rel="stylesheet" th:href="@{/style.css}" />
</head>
<body>

<div th:replace="~{fragments/navigation-bar :: navigation-bar(
        ~{fragments/navigation-bar-elements :: back-to-menu},
        'Startscreen',
        ~{fragments/navigation-bar :: empty})}">
</div>

<div class="page center-screen">
  <div class="box">
    <h2 th:text="'You want to start this game?'">
      You want to start this game?
    </h2>

    <form th:action="@{/games/{id}/start(id=${game.id})}"
          method="post"
          style="margin-top:16px;">

      <div style="margin-bottom:16px; text-align:left;">
        <label for="instanceLabel">
          Please add a unique identifier to specifiy your game!
        </label>
        <input id="instanceLabel"
               name="instanceLabel"
               class="input"
               placeholder="name of your group" />
      </div>

      <button class="button button-large" type="submit">
        Start!
      </button>
    </form>
  </div>
</div>

</body>
</html>
